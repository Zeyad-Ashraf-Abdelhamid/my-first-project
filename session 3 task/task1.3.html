<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="survey-form">

    <h1 class="survey-title">Survey Form</h1>

    <div class="survey-card">
        <p class="survey-description">Let us know how we can improve freeCodeCamp</p>

        <form class="survey-form">
            
            <div class="survey-field">
                <label for="survey-name" class="survey-label">* Name:</label>
                <input type="text" id="survey-name" class="survey-input" placeholder="Enter your name" required>
            </div>

            <div class="survey-field">
                <label for="survey-email" class="survey-label">* Email:</label>
                <input type="email" id="survey-email" class="survey-input" placeholder="Enter your Email" required>
            </div>

            <div class="survey-field">
                <label for="survey-age" class="survey-label">* Age:</label>
                <input type="number" id="survey-age" class="survey-input" min="1" max="120" placeholder="Age" required>
            </div>

            <div class="survey-field">
                <label for="survey-role" class="survey-label">Which option best describes your current role?</label>
                <select id="survey-role" class="survey-select">
                    <option value="student" selected>Student</option>
                    <option value="job">Full Time Job</option>
                    <option value="learner">Full Time Learner</option>
                    <option value="preferNo">Prefer not to say</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="survey-field survey-field-top">
                <label class="survey-label">* How likely is that you would recommend freeCodeCamp to a friend?</label>
                <div class="survey-options-group">
                    <label class="survey-option-item">
                        <input type="radio" name="recommend" value="definitely"> Definitely
                    </label>
                    <label class="survey-option-item">
                        <input type="radio" name="recommend" value="maybe"> Maybe
                    </label>
                    <label class="survey-option-item">
                        <input type="radio" name="recommend" value="not-sure"> Not sure
                    </label>
                </div>
            </div>

            <div class="survey-field">
                <label for="survey-like" class="survey-label">What do you like most in FCC:</label>
                <select id="survey-like" class="survey-select">
                    <option disabled selected>Select an option</option>
                    <option value="challenges">Challenges</option>
                    <option value="projects">Projects</option>
                    <option value="community">Community</option>
                    <option value="openSource">Open Source</option>
                </select>
            </div>

            <div class="survey-field survey-field-top">
                <label class="survey-label">Things that should be improved in the future<br><small>(Check all that apply):</small></label>
                <div class="survey-options-group">
                    <label class="survey-option-item">
                        <input type="checkbox" value="frontend"> Front-end Projects
                    </label>
                    <label class="survey-option-item">
                        <input type="checkbox" value="backend"> Back-end Projects
                    </label>
                    <label class="survey-option-item">
                        <input type="checkbox" value="visualization"> Data Visualization
                    </label>
                </div>
            </div>

        </form>
    </div>

</body>
</html>
